<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Detector</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      gap: 1.2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
    }
    h1 span { color: #7c6af7; }

    #status {
      font-size: 0.85rem;
      color: #666;
      min-height: 1.2em;
      text-align: center;
    }
    #status.error { color: #f87171; }
    #status.ok    { color: #4ade80; }

    /* ── camera wrapper ── */
    #cam-wrap {
      position: relative;
      width: min(640px, 100vw);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 0 2px #222, 0 8px 32px rgba(0,0,0,.7);
      aspect-ratio: 4/3;
    }

    #video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    #video.mirror { transform: scaleX(-1); }

    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #overlay.mirror { transform: scaleX(-1); }

    /* flip button */
    #btn-flip {
      position: absolute;
      bottom: 12px; right: 12px;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 50%;
      width: 48px; height: 48px;
      font-size: 1.4rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, transform 0.3s;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    #btn-flip:active { background: rgba(124,106,247,0.5); transform: rotate(180deg); }

    /* ── group happiness meter ── */
    #happiness-section {
      width: min(640px, 100%);
      background: #141414;
      border-radius: 14px;
      padding: 1.1rem 1.4rem;
      border: 1px solid #222;
    }

    #happiness-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }

    #happiness-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
    }

    #face-count {
      font-size: 0.8rem;
      color: #555;
    }
    #face-count span { color: #a78bfa; font-weight: 700; }

    #happiness-value {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      margin-bottom: 0.5rem;
      font-variant-numeric: tabular-nums;
    }

    #happiness-bar-track {
      background: #1e1e1e;
      border-radius: 99px;
      height: 12px;
      overflow: hidden;
    }

    #happiness-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #7c6af7, #f9a8d4);
      box-shadow: 0 0 10px #7c6af755;
      transition: width 0.25s ease;
      width: 0%;
    }

    /* ── face cards ── */
    #face-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      width: min(640px, 100%);
    }

    .face-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 0.6rem 0.9rem;
      flex: 1 1 130px;
      min-width: 120px;
    }

    .face-card-title {
      font-size: 0.72rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
    }

    .face-card-emotion {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-transform: capitalize;
    }

    .face-card-happy {
      font-size: 0.78rem;
      color: #a78bfa;
      margin-top: 0.15rem;
    }

    /* ── no face ── */
    #no-face {
      font-size: 0.85rem;
      color: #444;
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

<h1>Emotion <span>Detector</span></h1>
<p id="status">Loading models…</p>

<div id="cam-wrap">
  <video id="video" autoplay muted playsinline class="mirror"></video>
  <canvas id="overlay" class="mirror"></canvas>
  <button id="btn-flip" title="Switch camera">🔄</button>
</div>

<p id="no-face"></p>

<div id="happiness-section">
  <div id="happiness-header">
    <span id="happiness-title">😊 Group Happiness</span>
    <span id="face-count">Faces detected: <span id="face-num">0</span></span>
  </div>
  <div id="happiness-value">—</div>
  <div id="happiness-bar-track">
    <div id="happiness-bar-fill"></div>
  </div>
</div>

<div id="face-cards"></div>

<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
const INTERVAL  = 200;

const EMOJI = { happy:'😊', sad:'😢', angry:'😠', fearful:'😨', disgusted:'🤢', surprised:'😲', neutral:'😐' };
const COLORS = ['#7c6af7','#f472b6','#34d399','#fb923c','#60a5fa','#f87171','#a3e635','#facc15'];

const statusEl   = document.getElementById('status');
const video      = document.getElementById('video');
const overlay    = document.getElementById('overlay');
const ctx        = overlay.getContext('2d');
const btnFlip    = document.getElementById('btn-flip');
const noFaceEl   = document.getElementById('no-face');
const faceNumEl  = document.getElementById('face-num');
const happyVal   = document.getElementById('happiness-value');
const happyBar   = document.getElementById('happiness-bar-fill');
const faceCards  = document.getElementById('face-cards');

let currentStream = null;
let facingMode    = 'user'; // front camera by default

function setStatus(msg, cls = '') {
  statusEl.textContent = msg;
  statusEl.className   = cls;
}

function syncOverlay() {
  overlay.width  = video.videoWidth  || video.offsetWidth;
  overlay.height = video.videoHeight || video.offsetHeight;
}

// mirror front cam, don't mirror back cam
function applyMirror() {
  const m = facingMode === 'user';
  video.classList.toggle('mirror', m);
  overlay.classList.toggle('mirror', m);
}

async function startCamera() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());

  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 960 } }
    });
    video.srcObject = currentStream;
    await new Promise(res => video.onloadedmetadata = res);
    applyMirror();
    syncOverlay();
    setStatus('Running — point camera at faces', 'ok');
  } catch (err) {
    if (err.name === 'NotAllowedError') setStatus('Camera access denied. Please allow camera and reload.', 'error');
    else if (err.name === 'NotFoundError') setStatus('No camera found.', 'error');
    else setStatus(`Camera error: ${err.message}`, 'error');
  }
}

btnFlip.addEventListener('click', async () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  await startCamera();
});

function dominant(expressions) {
  return Object.entries(expressions).reduce((a, b) => b[1] > a[1] ? b : a)[0];
}

function drawBoxes(detections) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const scaleX = overlay.width  / (video.videoWidth  || overlay.width);
  const scaleY = overlay.height / (video.videoHeight || overlay.height);

  detections.forEach((d, i) => {
    const { x, y, width, height } = d.detection.box;
    const color = COLORS[i % COLORS.length];
    ctx.strokeStyle = color;
    ctx.lineWidth   = 2.5;
    ctx.shadowColor = color;
    ctx.shadowBlur  = 8;
    ctx.strokeRect(x * scaleX, y * scaleY, width * scaleX, height * scaleY);
    ctx.shadowBlur  = 0;

    // face index label
    ctx.fillStyle = color;
    ctx.font = 'bold 13px Segoe UI, sans-serif';
    ctx.fillText(`#${i + 1}`, x * scaleX + 4, y * scaleY - 5);
  });
}

function updateHappiness(detections) {
  faceNumEl.textContent = detections.length;

  if (detections.length === 0) {
    happyVal.textContent = '—';
    happyBar.style.width = '0%';
    faceCards.innerHTML  = '';
    noFaceEl.textContent = 'No face detected';
    return;
  }
  noFaceEl.textContent = '';

  // average happiness across all faces
  const avgHappy = detections.reduce((sum, d) => sum + (d.expressions.happy || 0), 0) / detections.length;
  const pct = Math.round(avgHappy * 100);
  happyVal.textContent  = pct + '%';
  happyBar.style.width  = pct + '%';

  // per-face cards
  faceCards.innerHTML = '';
  detections.forEach((d, i) => {
    const dom   = dominant(d.expressions);
    const happy = Math.round((d.expressions.happy || 0) * 100);
    const color = COLORS[i % COLORS.length];

    const card = document.createElement('div');
    card.className = 'face-card';
    card.style.borderColor = color + '55';
    card.innerHTML = `
      <div class="face-card-title" style="color:${color}">Face #${i + 1}</div>
      <div class="face-card-emotion">${EMOJI[dom]} ${dom}</div>
      <div class="face-card-happy">😊 Happiness: ${happy}%</div>`;
    faceCards.appendChild(card);
  });
}

async function detectLoop() {
  syncOverlay();
  try {
    const results = await faceapi
      .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 }))
      .withFaceExpressions();

    drawBoxes(results);
    updateHappiness(results);
  } catch (_) {}
  setTimeout(detectLoop, INTERVAL);
}

async function init() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('getUserMedia not supported. Use HTTPS.', 'error');
    return;
  }
  try {
    setStatus('Loading models…');
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
    ]);
    setStatus('Models loaded — starting camera…');
    await startCamera();
    detectLoop();
  } catch (err) {
    setStatus(`Failed to load models: ${err.message}`, 'error');
  }
}

window.addEventListener('load', init);
</script>
</body>
</html>
