<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Detector</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      gap: 1.2rem;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: min(640px, 100%);
      justify-content: space-between;
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    h1 span { color: #7c6af7; }

    #known-count { font-size: 0.78rem; color: #555; white-space: nowrap; }
    #known-count b { color: #a78bfa; }

    #btn-reset {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #btn-reset:hover { border-color: #f87171; color: #f87171; }

    #status {
      font-size: 0.85rem; color: #555;
      min-height: 1.2em; text-align: center;
      width: min(640px, 100%);
    }
    #status.error { color: #f87171; }
    #status.ok    { color: #4ade80; }

    /* ── camera ── */
    #cam-wrap {
      position: relative;
      width: min(640px, 100vw);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 0 2px #222, 0 8px 32px rgba(0,0,0,.7);
      aspect-ratio: 4/3;
    }

    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #video.mirror { transform: scaleX(-1); }
    #overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    #overlay.mirror { transform: scaleX(-1); }

    #btn-flip {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(255,255,255,0.1);
      border: none; border-radius: 50%;
      width: 48px; height: 48px;
      font-size: 1.4rem; cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, transform 0.35s;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    #btn-flip:active { background: rgba(124,106,247,0.4); transform: rotate(180deg); }

    /* ── metric panels ── */
    #metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      width: min(640px, 100%);
    }

    .metric-panel {
      background: #141414;
      border-radius: 14px;
      padding: 1rem 1.2rem;
      border: 1px solid #222;
    }

    .metric-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 0.5rem;
    }

    .metric-value {
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      margin-bottom: 0.4rem;
      font-variant-numeric: tabular-nums;
    }

    .metric-bar-track {
      background: #1e1e1e;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .metric-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.25s ease, background 0.4s ease;
      width: 0%;
    }

    #happiness-bar-fill {
      background: linear-gradient(90deg, #7c6af7, #f9a8d4);
      box-shadow: 0 0 8px #7c6af755;
    }

    #attention-bar-fill {
      background: linear-gradient(90deg, #f87171, #facc15, #4ade80);
      box-shadow: 0 0 8px #4ade8055;
    }

    /* face count row */
    #face-count-row {
      font-size: 0.78rem;
      color: #444;
      width: min(640px, 100%);
      text-align: right;
      padding-right: 0.2rem;
    }
    #face-count-row span { color: #a78bfa; font-weight: 700; }

    /* ── face cards ── */
    #face-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      width: min(640px, 100%);
    }

    .face-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      flex: 1 1 140px;
      min-width: 120px;
      transition: border-color 0.4s;
    }

    .fc-id {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.3rem;
      font-weight: 700;
    }

    .fc-emotion {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      text-transform: capitalize;
      margin-bottom: 0.25rem;
    }

    .fc-stats {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.3rem;
    }

    .fc-stat-row {
      display: grid;
      grid-template-columns: 1.1rem 1fr 34px;
      align-items: center;
      gap: 0.4rem;
    }

    .fc-stat-icon { font-size: 0.75rem; text-align: center; }

    .fc-mini-track {
      background: #1e1e1e;
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
    }

    .fc-mini-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.25s ease, background 0.4s ease;
    }

    .fc-stat-pct {
      font-size: 0.7rem;
      color: #666;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .fc-new {
      font-size: 0.65rem;
      color: #4ade80;
      margin-top: 0.3rem;
    }

    #no-face {
      font-size: 0.82rem; color: #3a3a3a;
      text-align: center; min-height: 1.2em;
    }
  </style>
</head>
<body>

<header>
  <h1>Emotion <span>Detector</span></h1>
  <div style="display:flex;align-items:center;gap:0.7rem">
    <span id="known-count">Known: <b id="known-num">0</b></span>
    <button id="btn-reset">Reset</button>
  </div>
</header>

<p id="status">Loading models…</p>

<div id="cam-wrap">
  <video id="video" autoplay muted playsinline class="mirror"></video>
  <canvas id="overlay" class="mirror"></canvas>
  <button id="btn-flip" title="Switch camera">🔄</button>
</div>

<p id="no-face"></p>

<div id="metrics">
  <div class="metric-panel">
    <div class="metric-label">😊 Group Happiness</div>
    <div class="metric-value" id="happiness-value">—</div>
    <div class="metric-bar-track">
      <div class="metric-bar-fill" id="happiness-bar-fill"></div>
    </div>
  </div>
  <div class="metric-panel">
    <div class="metric-label">🎯 Group Attention</div>
    <div class="metric-value" id="attention-value">—</div>
    <div class="metric-bar-track">
      <div class="metric-bar-fill" id="attention-bar-fill"></div>
    </div>
  </div>
</div>

<div id="face-count-row">Faces detected: <span id="face-num">0</span></div>

<div id="face-cards"></div>

<script>
// ── Config ───────────────────────────────────────────────
const MODEL_URL       = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
const INTERVAL        = 200;
const MATCH_THRESHOLD = 0.50;
const MAX_DESCRIPTORS = 10;
const STORAGE_KEY     = 'emo-detector-faces-v1';

const COLORS = ['#7c6af7','#f472b6','#34d399','#fb923c','#60a5fa','#f87171','#a3e635','#facc15'];
const EMOJI  = { happy:'😊', sad:'😢', angry:'😠', fearful:'😨', disgusted:'🤢', surprised:'😲', neutral:'😐' };

// ── DOM ──────────────────────────────────────────────────
const statusEl    = document.getElementById('status');
const video       = document.getElementById('video');
const overlay     = document.getElementById('overlay');
const ctx         = overlay.getContext('2d');
const btnFlip     = document.getElementById('btn-flip');
const btnReset    = document.getElementById('btn-reset');
const noFaceEl    = document.getElementById('no-face');
const faceNumEl   = document.getElementById('face-num');
const knownNumEl  = document.getElementById('known-num');
const happyVal    = document.getElementById('happiness-value');
const happyBar    = document.getElementById('happiness-bar-fill');
const attentionVal = document.getElementById('attention-value');
const attentionBar = document.getElementById('attention-bar-fill');
const faceCards   = document.getElementById('face-cards');

// ── State ────────────────────────────────────────────────
let currentStream = null;
let facingMode    = 'user';
let knownFaces    = [];
let nextId        = 1;

// ── Persistence ──────────────────────────────────────────
function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    knownFaces = data.map(f => ({
      id: f.id,
      descriptors: f.descriptors.map(d => new Float32Array(d))
    }));
    if (knownFaces.length) nextId = Math.max(...knownFaces.map(f => f.id)) + 1;
  } catch (_) { knownFaces = []; nextId = 1; }
  updateKnownCount();
}

function saveStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(
      knownFaces.map(f => ({ id: f.id, descriptors: f.descriptors.map(d => Array.from(d)) }))
    ));
  } catch (_) {}
  updateKnownCount();
}

function updateKnownCount() { knownNumEl.textContent = knownFaces.length; }

// ── Face matching ─────────────────────────────────────────
function bestMatch(descriptor) {
  let bestId = null, bestDist = Infinity;
  for (const face of knownFaces) {
    for (const stored of face.descriptors) {
      const dist = faceapi.euclideanDistance(descriptor, stored);
      if (dist < bestDist) { bestDist = dist; bestId = face.id; }
    }
  }
  return bestDist < MATCH_THRESHOLD ? { id: bestId } : null;
}

function assignId(descriptor) {
  const match = bestMatch(descriptor);
  if (match) {
    const face = knownFaces.find(f => f.id === match.id);
    face.descriptors.push(descriptor);
    if (face.descriptors.length > MAX_DESCRIPTORS) face.descriptors.shift();
    saveStorage();
    return { id: match.id, isNew: false };
  }
  const id = nextId++;
  knownFaces.push({ id, descriptors: [descriptor] });
  saveStorage();
  return { id, isNew: true };
}

// ── Attention from landmarks ──────────────────────────────
// Uses 68-point landmark geometry to estimate head orientation.
// Horizontal: nose tip offset from jaw midpoint → yaw (looking left/right)
// Vertical:   nose tip position in eye-to-chin span → pitch (looking up/down)
function computeAttention(landmarks) {
  const p = landmarks.positions;

  // Jaw endpoints: 0 (left) → 16 (right)
  const faceW = p[16].x - p[0].x;
  if (faceW < 10) return 0.5;

  // Yaw: how far nose tip deviates from face horizontal center
  const centerX  = (p[0].x + p[16].x) / 2;
  const yawRatio = Math.abs(p[30].x - centerX) / (faceW / 2); // 0=straight, >1=sideways

  // Pitch: nose tip Y position within eye-to-chin vertical span
  const eyeY    = (p[36].y + p[45].y) / 2; // avg of outer eye corners
  const chinY   = p[8].y;
  const faceH   = chinY - eyeY;
  const noseRelY = faceH > 10 ? (p[30].y - eyeY) / faceH : 0.5;
  // Looking straight ≈ 0.5; deviation → distracted
  const pitchRatio = Math.abs(noseRelY - 0.5) / 0.45;

  // Take the worse of the two axes, apply a sensitivity factor
  const distraction = Math.min(1, Math.max(yawRatio, pitchRatio) * 1.3);
  return Math.max(0, 1 - distraction);
}

function attentionColor(score) {
  // 0 = red, 0.5 = yellow, 1 = green
  if (score > 0.65) return '#4ade80';
  if (score > 0.35) return '#facc15';
  return '#f87171';
}

// ── Camera ───────────────────────────────────────────────
function setStatus(msg, cls = '') { statusEl.textContent = msg; statusEl.className = cls; }

function syncOverlay() {
  overlay.width  = video.videoWidth  || video.offsetWidth;
  overlay.height = video.videoHeight || video.offsetHeight;
}

function applyMirror() {
  const m = facingMode === 'user';
  video.classList.toggle('mirror', m);
  overlay.classList.toggle('mirror', m);
}

async function startCamera() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 960 } }
    });
    video.srcObject = currentStream;
    await new Promise(res => video.onloadedmetadata = res);
    applyMirror(); syncOverlay();
    setStatus('Running — point camera at faces', 'ok');
  } catch (err) {
    if (err.name === 'NotAllowedError') setStatus('Camera access denied.', 'error');
    else if (err.name === 'NotFoundError') setStatus('No camera found.', 'error');
    else setStatus(`Camera error: ${err.message}`, 'error');
  }
}

btnFlip.addEventListener('click', async () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  await startCamera();
});

btnReset.addEventListener('click', () => {
  if (!confirm('Forget all stored faces?')) return;
  localStorage.removeItem(STORAGE_KEY);
  knownFaces = []; nextId = 1;
  updateKnownCount();
});

// ── Drawing ──────────────────────────────────────────────
function colorFor(id) { return COLORS[(id - 1) % COLORS.length]; }

function dominant(expressions) {
  return Object.entries(expressions).reduce((a, b) => b[1] > a[1] ? b : a)[0];
}

function drawBoxes(results) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const sx = overlay.width  / (video.videoWidth  || overlay.width);
  const sy = overlay.height / (video.videoHeight || overlay.height);

  results.forEach(({ detection, personId, attention }) => {
    const { x, y, width, height } = detection.box;
    const idColor  = colorFor(personId);
    const attColor = attentionColor(attention);

    // main box in person color
    ctx.strokeStyle = idColor;
    ctx.lineWidth   = 2.5;
    ctx.shadowColor = idColor;
    ctx.shadowBlur  = 8;
    ctx.strokeRect(x * sx, y * sy, width * sx, height * sy);
    ctx.shadowBlur  = 0;

    // person label
    ctx.fillStyle = idColor;
    ctx.font      = 'bold 13px Segoe UI, sans-serif';
    ctx.fillText(`P${personId}`, x * sx + 4, y * sy - 16);

    // attention indicator dot
    const dotX = (x + width) * sx - 10;
    const dotY = y * sy - 10;
    ctx.beginPath();
    ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
    ctx.fillStyle   = attColor;
    ctx.shadowColor = attColor;
    ctx.shadowBlur  = 6;
    ctx.fill();
    ctx.shadowBlur  = 0;
  });
}

// ── UI update ─────────────────────────────────────────────
function updateUI(results) {
  faceNumEl.textContent = results.length;

  if (results.length === 0) {
    happyVal.textContent     = '—';
    attentionVal.textContent = '—';
    happyBar.style.width     = '0%';
    attentionBar.style.width = '0%';
    faceCards.innerHTML      = '';
    noFaceEl.textContent     = 'No face detected';
    return;
  }
  noFaceEl.textContent = '';

  const n = results.length;
  const avgHappy     = results.reduce((s, r) => s + (r.expressions.happy || 0), 0) / n;
  const avgAttention = results.reduce((s, r) => s + r.attention, 0) / n;

  const hp = Math.round(avgHappy     * 100);
  const ap = Math.round(avgAttention * 100);

  happyVal.textContent     = hp + '%';
  happyBar.style.width     = hp + '%';
  attentionVal.textContent = ap + '%';
  attentionBar.style.width = ap + '%';
  attentionVal.style.color = attentionColor(avgAttention);

  faceCards.innerHTML = '';
  results.forEach(({ personId, isNew, expressions, attention }) => {
    const dom    = dominant(expressions);
    const happy  = Math.round((expressions.happy || 0) * 100);
    const attPct = Math.round(attention * 100);
    const color  = colorFor(personId);
    const aColor = attentionColor(attention);

    const card = document.createElement('div');
    card.className = 'face-card';
    card.style.borderColor = color + '55';
    card.innerHTML = `
      <div class="fc-id" style="color:${color}">Person ${personId}</div>
      <div class="fc-emotion">${EMOJI[dom]} ${dom}</div>
      <div class="fc-stats">
        <div class="fc-stat-row">
          <span class="fc-stat-icon">😊</span>
          <div class="fc-mini-track">
            <div class="fc-mini-fill" style="width:${happy}%;background:#a78bfa"></div>
          </div>
          <span class="fc-stat-pct">${happy}%</span>
        </div>
        <div class="fc-stat-row">
          <span class="fc-stat-icon">🎯</span>
          <div class="fc-mini-track">
            <div class="fc-mini-fill" style="width:${attPct}%;background:${aColor}"></div>
          </div>
          <span class="fc-stat-pct" style="color:${aColor}">${attPct}%</span>
        </div>
      </div>
      ${isNew ? '<div class="fc-new">✦ New face saved</div>' : ''}`;
    faceCards.appendChild(card);
  });
}

// ── Detection loop ────────────────────────────────────────
async function detectLoop() {
  syncOverlay();
  try {
    const detections = await faceapi
      .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 }))
      .withFaceLandmarks(true)
      .withFaceExpressions()
      .withFaceDescriptors();

    const results = detections.map(d => {
      const { id, isNew } = assignId(d.descriptor);
      return {
        detection:   d.detection,
        expressions: d.expressions,
        personId:    id,
        isNew,
        attention:   computeAttention(d.landmarks)
      };
    });

    drawBoxes(results);
    updateUI(results);
  } catch (_) {}

  setTimeout(detectLoop, INTERVAL);
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('getUserMedia not supported. Use HTTPS.', 'error');
    return;
  }
  loadStorage();
  try {
    setStatus('Loading models (first load ~10s)…');
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
      faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
    ]);
    setStatus('Models loaded — starting camera…');
    await startCamera();
    detectLoop();
  } catch (err) {
    setStatus(`Failed to load models: ${err.message}`, 'error');
  }
}

window.addEventListener('load', init);
</script>
</body>
</html>
