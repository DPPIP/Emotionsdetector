<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Detector</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      gap: 1.2rem;
    }

    header {
      display: flex;
      align-items: center;
      width: min(640px, 100%);
      justify-content: space-between;
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    h1 span { color: #7c6af7; }

    #known-count { font-size: 0.78rem; color: #555; white-space: nowrap; }
    #known-count b { color: #a78bfa; }

    #btn-reset {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #btn-reset:hover { border-color: #f87171; color: #f87171; }

    #status {
      font-size: 0.85rem; color: #555;
      min-height: 1.2em; text-align: center;
      width: min(640px, 100%);
    }
    #status.error { color: #f87171; }
    #status.ok    { color: #4ade80; }

    /* ── camera ── */
    #cam-wrap {
      position: relative;
      width: min(640px, 100vw);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 0 2px #222, 0 8px 32px rgba(0,0,0,.7);
      aspect-ratio: 4/3;
    }

    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #video.mirror { transform: scaleX(-1); }
    #overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    #overlay.mirror { transform: scaleX(-1); }

    #btn-flip {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(255,255,255,0.1);
      border: none; border-radius: 50%;
      width: 48px; height: 48px;
      font-size: 1.4rem; cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, transform 0.35s;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    #btn-flip:active { background: rgba(124,106,247,0.4); transform: rotate(180deg); }

    /* ── happiness panel ── */
    #happiness-panel {
      width: min(640px, 100%);
      background: #141414;
      border-radius: 14px;
      padding: 1.1rem 1.4rem;
      border: 1px solid #222;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .panel-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
    }

    #face-count { font-size: 0.78rem; color: #444; }
    #face-count span { color: #a78bfa; font-weight: 700; }

    #happiness-value {
      font-size: 3rem; font-weight: 900; line-height: 1;
      color: #fff; margin-bottom: 0.45rem;
      font-variant-numeric: tabular-nums;
    }

    #happiness-bar-track {
      background: #1e1e1e; border-radius: 99px; height: 10px; overflow: hidden;
    }
    #happiness-bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #7c6af7, #f9a8d4);
      box-shadow: 0 0 10px #7c6af755;
      transition: width 0.2s ease;
      width: 0%;
    }

    /* ── chart ── */
    #chart-panel {
      width: min(640px, 100%);
      background: #141414;
      border-radius: 14px;
      padding: 1rem 1.2rem 0.8rem;
      border: 1px solid #222;
    }

    #chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.7rem;
    }

    #chart-duration {
      font-size: 0.72rem;
      color: #444;
    }

    #chart-canvas {
      width: 100%;
      height: 120px;
      display: block;
      border-radius: 6px;
    }

    /* ── face cards ── */
    #face-count-row {
      font-size: 0.75rem; color: #333;
      width: min(640px, 100%);
      text-align: right;
    }

    #face-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      width: min(640px, 100%);
    }

    .face-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      flex: 1 1 140px;
      min-width: 120px;
    }

    .fc-id {
      font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 0.3rem; font-weight: 700;
    }
    .fc-emotion { font-size: 1rem; font-weight: 700; color: #fff; text-transform: capitalize; }
    .fc-happy   { font-size: 0.78rem; color: #a78bfa; margin-top: 0.2rem; }
    .fc-new     { font-size: 0.65rem; color: #4ade80; margin-top: 0.25rem; }

    #no-face { font-size: 0.82rem; color: #333; text-align: center; min-height: 1.2em; }
  </style>
</head>
<body>

<header>
  <h1>Emotion <span>Detector</span></h1>
  <div style="display:flex;align-items:center;gap:0.7rem">
    <span id="known-count">Known: <b id="known-num">0</b></span>
    <button id="btn-reset">Reset</button>
  </div>
</header>

<p id="status">Loading models…</p>

<div id="cam-wrap">
  <video id="video" autoplay muted playsinline class="mirror"></video>
  <canvas id="overlay" class="mirror"></canvas>
  <button id="btn-flip" title="Switch camera">🔄</button>
</div>

<p id="no-face"></p>

<div id="happiness-panel">
  <div class="panel-header">
    <span class="panel-label">😊 Group Happiness</span>
    <span id="face-count">Faces: <span id="face-num">0</span></span>
  </div>
  <div id="happiness-value">—</div>
  <div id="happiness-bar-track">
    <div id="happiness-bar-fill"></div>
  </div>
</div>

<div id="chart-panel">
  <div id="chart-header">
    <span class="panel-label">📈 Happiness over time</span>
    <span id="chart-duration">—</span>
  </div>
  <canvas id="chart-canvas"></canvas>
</div>

<div id="face-cards"></div>

<script>
// ── Config ───────────────────────────────────────────────
const MODEL_URL       = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
const DETECT_INTERVAL = 200;   // ms
const SAMPLE_INTERVAL = 1000;  // ms — how often to add a chart point
const MAX_SAMPLES     = 120;   // 2 minutes of history
const MATCH_THRESHOLD = 0.50;
const MAX_DESCRIPTORS = 10;
const STORAGE_KEY     = 'emo-detector-faces-v1';

const COLORS = ['#7c6af7','#f472b6','#34d399','#fb923c','#60a5fa','#f87171','#a3e635','#facc15'];
const EMOJI  = { happy:'😊', sad:'😢', angry:'😠', fearful:'😨', disgusted:'🤢', surprised:'😲', neutral:'😐' };

// ── DOM ──────────────────────────────────────────────────
const statusEl   = document.getElementById('status');
const video      = document.getElementById('video');
const overlay    = document.getElementById('overlay');
const overlayCtx = overlay.getContext('2d');
const btnFlip    = document.getElementById('btn-flip');
const btnReset   = document.getElementById('btn-reset');
const noFaceEl   = document.getElementById('no-face');
const faceNumEl  = document.getElementById('face-num');
const knownNumEl = document.getElementById('known-num');
const happyVal   = document.getElementById('happiness-value');
const happyBar   = document.getElementById('happiness-bar-fill');
const faceCards  = document.getElementById('face-cards');
const chartCanvas= document.getElementById('chart-canvas');
const chartCtx   = chartCanvas.getContext('2d');
const chartDur   = document.getElementById('chart-duration');

// ── State ────────────────────────────────────────────────
let currentStream = null;
let facingMode    = 'user';
let knownFaces    = [];
let nextId        = 1;

// chart data: [{t: timestamp, v: 0-1}]
let chartData     = [];
let lastSample    = 0;
let currentHappy  = null; // latest group happiness (0-1 or null)

// ── Persistence ──────────────────────────────────────────
function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    knownFaces = data.map(f => ({
      id: f.id,
      descriptors: f.descriptors.map(d => new Float32Array(d))
    }));
    if (knownFaces.length) nextId = Math.max(...knownFaces.map(f => f.id)) + 1;
  } catch (_) { knownFaces = []; nextId = 1; }
  updateKnownCount();
}

function saveStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(
      knownFaces.map(f => ({ id: f.id, descriptors: f.descriptors.map(d => Array.from(d)) }))
    ));
  } catch (_) {}
  updateKnownCount();
}

function updateKnownCount() { knownNumEl.textContent = knownFaces.length; }

// ── Face matching ─────────────────────────────────────────
function bestMatch(descriptor) {
  let bestId = null, bestDist = Infinity;
  for (const face of knownFaces) {
    for (const stored of face.descriptors) {
      const dist = faceapi.euclideanDistance(descriptor, stored);
      if (dist < bestDist) { bestDist = dist; bestId = face.id; }
    }
  }
  return bestDist < MATCH_THRESHOLD ? { id: bestId } : null;
}

function assignId(descriptor) {
  const match = bestMatch(descriptor);
  if (match) {
    const face = knownFaces.find(f => f.id === match.id);
    face.descriptors.push(descriptor);
    if (face.descriptors.length > MAX_DESCRIPTORS) face.descriptors.shift();
    saveStorage();
    return { id: match.id, isNew: false };
  }
  const id = nextId++;
  knownFaces.push({ id, descriptors: [descriptor] });
  saveStorage();
  return { id, isNew: true };
}

// ── Chart ─────────────────────────────────────────────────
function resizeChart() {
  const rect = chartCanvas.getBoundingClientRect();
  chartCanvas.width  = rect.width  * devicePixelRatio;
  chartCanvas.height = rect.height * devicePixelRatio;
  drawChart();
}

function sampleHappiness() {
  const now = Date.now();
  if (now - lastSample < SAMPLE_INTERVAL) return;
  lastSample = now;

  chartData.push({ t: now, v: currentHappy ?? 0 });
  if (chartData.length > MAX_SAMPLES) chartData.shift();
  drawChart();
}

function drawChart() {
  const w = chartCanvas.width;
  const h = chartCanvas.height;
  chartCtx.clearRect(0, 0, w, h);

  const pad = { top: 10, right: 10, bottom: 20, left: 32 };
  const iw  = w - pad.left - pad.right;
  const ih  = h - pad.top  - pad.bottom;

  // grid lines
  chartCtx.strokeStyle = '#1e1e1e';
  chartCtx.lineWidth   = 1;
  [0, 0.25, 0.5, 0.75, 1].forEach(v => {
    const y = pad.top + ih * (1 - v);
    chartCtx.beginPath();
    chartCtx.moveTo(pad.left, y);
    chartCtx.lineTo(pad.left + iw, y);
    chartCtx.stroke();
    chartCtx.fillStyle = '#333';
    chartCtx.font = `${10 * devicePixelRatio}px Segoe UI, sans-serif`;
    chartCtx.textAlign = 'right';
    chartCtx.fillText(Math.round(v * 100) + '%', pad.left - 4, y + 4);
  });

  if (chartData.length < 2) {
    chartDur.textContent = '—';
    return;
  }

  const tMin = chartData[0].t;
  const tMax = chartData[chartData.length - 1].t;
  const span = tMax - tMin || 1;

  // duration label
  const secs = Math.round(span / 1000);
  chartDur.textContent = secs < 60 ? `${secs}s` : `${Math.floor(secs/60)}m ${secs%60}s`;

  // filled area under the line
  const gradient = chartCtx.createLinearGradient(0, pad.top, 0, pad.top + ih);
  gradient.addColorStop(0,   'rgba(124,106,247,0.4)');
  gradient.addColorStop(1,   'rgba(124,106,247,0.0)');

  chartCtx.beginPath();
  chartData.forEach((pt, i) => {
    const x = pad.left + ((pt.t - tMin) / span) * iw;
    const y = pad.top  + ih * (1 - pt.v);
    i === 0 ? chartCtx.moveTo(x, y) : chartCtx.lineTo(x, y);
  });
  // close path for fill
  const lastX = pad.left + iw;
  chartCtx.lineTo(lastX, pad.top + ih);
  chartCtx.lineTo(pad.left, pad.top + ih);
  chartCtx.closePath();
  chartCtx.fillStyle = gradient;
  chartCtx.fill();

  // line
  chartCtx.beginPath();
  chartData.forEach((pt, i) => {
    const x = pad.left + ((pt.t - tMin) / span) * iw;
    const y = pad.top  + ih * (1 - pt.v);
    i === 0 ? chartCtx.moveTo(x, y) : chartCtx.lineTo(x, y);
  });
  chartCtx.strokeStyle = '#a78bfa';
  chartCtx.lineWidth   = 2 * devicePixelRatio;
  chartCtx.lineJoin    = 'round';
  chartCtx.stroke();

  // dot at current value
  const last  = chartData[chartData.length - 1];
  const dotX  = pad.left + iw;
  const dotY  = pad.top  + ih * (1 - last.v);
  chartCtx.beginPath();
  chartCtx.arc(dotX, dotY, 4 * devicePixelRatio, 0, Math.PI * 2);
  chartCtx.fillStyle   = '#f9a8d4';
  chartCtx.shadowColor = '#f9a8d4';
  chartCtx.shadowBlur  = 8 * devicePixelRatio;
  chartCtx.fill();
  chartCtx.shadowBlur  = 0;
}

// ── Camera ───────────────────────────────────────────────
function setStatus(msg, cls = '') { statusEl.textContent = msg; statusEl.className = cls; }

function syncOverlay() {
  overlay.width  = video.videoWidth  || video.offsetWidth;
  overlay.height = video.videoHeight || video.offsetHeight;
}

function applyMirror() {
  const m = facingMode === 'user';
  video.classList.toggle('mirror', m);
  overlay.classList.toggle('mirror', m);
}

async function startCamera() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = currentStream;
    await new Promise(res => video.onloadedmetadata = res);
    applyMirror(); syncOverlay();
    setStatus('Running — point camera at faces', 'ok');
  } catch (err) {
    if (err.name === 'NotAllowedError') setStatus('Camera access denied.', 'error');
    else if (err.name === 'NotFoundError') setStatus('No camera found.', 'error');
    else setStatus(`Camera error: ${err.message}`, 'error');
  }
}

btnFlip.addEventListener('click', async () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  await startCamera();
});

btnReset.addEventListener('click', () => {
  if (!confirm('Forget all stored faces?')) return;
  localStorage.removeItem(STORAGE_KEY);
  knownFaces = []; nextId = 1;
  chartData  = []; lastSample = 0; currentHappy = null;
  updateKnownCount();
  drawChart();
});

// ── Drawing ──────────────────────────────────────────────
function colorFor(id) { return COLORS[(id - 1) % COLORS.length]; }

function dominant(expressions) {
  return Object.entries(expressions).reduce((a, b) => b[1] > a[1] ? b : a)[0];
}

function drawBoxes(results) {
  overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
  const sx = overlay.width  / (video.videoWidth  || overlay.width);
  const sy = overlay.height / (video.videoHeight || overlay.height);

  results.forEach(({ detection, personId, expressions }) => {
    const { x, y, width, height } = detection.box;
    const color = colorFor(personId);
    const dom   = dominant(expressions);
    const scale = Math.max(0.7, Math.min(1, width * sx / 120)); // scale labels to box size

    overlayCtx.strokeStyle = color;
    overlayCtx.lineWidth   = 2.5;
    overlayCtx.shadowColor = color;
    overlayCtx.shadowBlur  = 8;
    overlayCtx.strokeRect(x * sx, y * sy, width * sx, height * sy);
    overlayCtx.shadowBlur  = 0;

    // pill background behind labels
    const fontSize  = Math.round(12 * scale);
    const labelText = `P${personId}  ${EMOJI[dom]} ${dom}`;
    overlayCtx.font = `bold ${fontSize}px Segoe UI, sans-serif`;
    const tw = overlayCtx.measureText(labelText).width;
    const ph = fontSize + 6;
    const px = x * sx;
    const py = y * sy - ph - 2;

    overlayCtx.fillStyle = 'rgba(0,0,0,0.55)';
    overlayCtx.beginPath();
    overlayCtx.roundRect(px, py, tw + 10, ph, 4);
    overlayCtx.fill();

    overlayCtx.fillStyle = color;
    overlayCtx.fillText(labelText, px + 5, py + ph - 4);
  });
}

// ── UI update ─────────────────────────────────────────────
function updateUI(results) {
  faceNumEl.textContent = results.length;

  if (results.length === 0) {
    currentHappy             = null;
    happyVal.textContent     = '—';
    happyBar.style.width     = '0%';
    faceCards.innerHTML      = '';
    noFaceEl.textContent     = 'No face detected';
    return;
  }
  noFaceEl.textContent = '';

  const avg = results.reduce((s, r) => s + (r.expressions.happy || 0), 0) / results.length;
  currentHappy = avg;

  const pct = Math.round(avg * 100);
  happyVal.textContent = pct + '%';
  happyBar.style.width = pct + '%';

  faceCards.innerHTML = '';
  results.forEach(({ personId, isNew, expressions }) => {
    const dom   = dominant(expressions);
    const happy = Math.round((expressions.happy || 0) * 100);
    const color = colorFor(personId);

    const card = document.createElement('div');
    card.className = 'face-card';
    card.style.borderColor = color + '55';
    card.innerHTML = `
      <div class="fc-id" style="color:${color}">Person ${personId}</div>
      <div class="fc-emotion">${EMOJI[dom]} ${dom}</div>
      <div class="fc-happy">😊 ${happy}%</div>
      ${isNew ? '<div class="fc-new">✦ New face saved</div>' : ''}`;
    faceCards.appendChild(card);
  });
}

// ── Detection loop ────────────────────────────────────────
async function detectLoop() {
  syncOverlay();
  try {
    const detections = await faceapi
      .detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.15, maxResults: 20 }))
      .withFaceLandmarks(true)
      .withFaceExpressions()
      .withFaceDescriptors();

    const results = detections.map(d => {
      const { id, isNew } = assignId(d.descriptor);
      return { detection: d.detection, expressions: d.expressions, personId: id, isNew };
    });

    drawBoxes(results);
    updateUI(results);
    sampleHappiness();
  } catch (_) {}

  setTimeout(detectLoop, DETECT_INTERVAL);
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('getUserMedia not supported. Use HTTPS.', 'error');
    return;
  }
  loadStorage();
  resizeChart();
  window.addEventListener('resize', resizeChart);

  try {
    setStatus('Loading models (first load ~10s)…');
    await Promise.all([
      faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
      faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
    ]);
    setStatus('Models loaded — starting camera…');
    await startCamera();
    detectLoop();
  } catch (err) {
    setStatus(`Failed to load models: ${err.message}`, 'error');
  }
}

window.addEventListener('load', init);
</script>
</body>
</html>
